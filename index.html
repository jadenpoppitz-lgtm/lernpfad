<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernpfad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <!-- 1 · Eingabe -->
  <section id="s-ask" class="screen active">
    <form id="ask-form">
      <input id="topic" type="text" autocomplete="off" autofocus
             placeholder="Was möchtest du lernen?" aria-label="Was möchtest du lernen?">
      <div id="details" class="hidden">
        <p class="label">In welchem Kontext?</p>
        <div class="chips" data-key="context">
          <button type="button" data-v="Hobby">Hobby</button>
          <button type="button" data-v="Beruf">Beruf</button>
          <button type="button" data-v="Studium / Schule">Studium / Schule</button>
          <button type="button" data-v="Eigenes Projekt">Eigenes Projekt</button>
        </div>
        <p class="label">Wie viel Zeit pro Woche?</p>
        <div class="chips" data-key="hours">
          <button type="button" data-v="2">2 h</button>
          <button type="button" data-v="5">5 h</button>
          <button type="button" data-v="10">10 h</button>
          <button type="button" data-v="20">20 h</button>
        </div>
        <button id="go" class="primary" disabled>Lernpfad erstellen →</button>
      </div>
    </form>
  </section>

  <!-- 2 · Loading (Mind-Map) -->
  <section id="s-load" class="screen">
    <svg id="map" viewBox="0 0 400 400" aria-hidden="true"></svg>
    <p id="load-text" class="muted"></p>
  </section>

  <!-- 3 · Einstiegstest -->
  <section id="s-test" class="screen">
    <p class="muted" id="test-step"></p>
    <h2 id="test-q"></h2>
    <div id="test-opts" class="stack"></div>
    <a id="intro-video" class="muted small" target="_blank" rel="noopener">▶ Einstiegsvideo ansehen</a>
  </section>

  <!-- 4 · Lernplan -->
  <section id="s-plan" class="screen wide">
    <header>
      <p class="muted" id="plan-meta"></p>
      <h1 id="plan-title"></h1>
      <p id="plan-sub"></p>
    </header>
    <div id="plan-phases"></div>
    <h3>Warum dieser Plan funktioniert</h3>
    <div id="plan-science"></div>
    <button id="restart" class="ghost">Neu starten</button>
  </section>

</main>
<script src="app.js"></script>
</body>
</html>
