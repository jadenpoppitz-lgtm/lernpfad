<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dreamz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="brand" id="brand" href="#" aria-label="dreamz Startseite">dream<span>z</span></a>
<main id="app">

  <!-- 1 · Eingabe -->
  <section id="s-ask" class="screen active">
    <h1>Was willst du können?</h1>
    <form id="ask-form" class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <input id="topic" type="text" autocomplete="off" autofocus aria-label="Skill, Rolle oder Ziel eingeben">
      <button type="submit" id="arrow" class="arrow" aria-label="Weiter" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <button type="button" id="demo" class="textlink">Demo: Data Science</button>
    <a href="#/hr" class="textlink faint">Für Unternehmen: Stellenanzeige hochladen</a>
  </section>

  <!-- 2 · Drei Fragen, jeweils einzeln -->
  <section id="s-step" class="screen step">
    <p class="eyebrow" id="step-topic"></p>
    <h2 id="step-q"></h2>
    <p class="count" id="step-count"></p>
    <div class="pills" id="step-opts"></div>
  </section>

  <!-- 3 · Loading (Mind-Map) -->
  <section id="s-load" class="screen">
    <svg id="map" viewBox="0 0 400 400" aria-hidden="true"></svg>
    <p id="load-text" class="muted"></p>
  </section>

  <!-- 4 · Wissenscheck: Video + Fragen -->
  <section id="s-test" class="screen top">
    <p class="eyebrow" id="test-topic"></p>
    <h2>Kurzer Wissenscheck.</h2>
    <div id="test-video"></div>
    <div id="test-qs"></div>
    <label for="notes" class="qh strong">Weitere Präferenzen</label>
    <textarea id="notes" maxlength="500" placeholder="Was sollen wir bei deinem Kurs berücksichtigen?"></textarea>
    <button id="test-go" class="primary" disabled>Kurs erstellen →</button>
  </section>

  <!-- 5 · Kurs wird erstellt -->
  <section id="s-wait" class="screen">
    <h2 id="wobble">Dein Kurs wird erstellt</h2>
  </section>

  <!-- 6 · Lernplan -->
  <section id="s-plan" class="screen top">
    <header>
      <p class="eyebrow" id="plan-meta"></p>
      <h1 id="plan-title"></h1>
      <div id="plan-sub"></div>
    </header>
    <div id="plan-phases"></div>
    <h3>Warum dieser Plan funktioniert</h3>
    <div id="plan-science"></div>
    <button id="to-job" class="primary hidden"></button>
    <button id="restart" class="ghost">Neu starten</button>
  </section>

  <!-- Funnel-Ansichten (HR, Bewerbung, Dashboard) – siehe jobs.js -->
  <section id="s-view" class="screen top"></section>

</main>
<script src="app.js"></script>
<script src="jobs.js"></script>
</body>
</html>
